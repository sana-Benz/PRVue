# Security checks of the platform repository: secrets in the whole history (Gitleaks)
# and misconfigurations in the infrastructure code (trivy config on platform/).
#
# Supply chain: every action is pinned by full commit SHA (tags can be moved, see the Trivy
# compromise CVE-2026-33634), the Gitleaks image by digest, and the Trivy binary by version.
# Dependabot (.github/dependabot.yml) proposes updates for the action SHAs.
name: Security

on:
  push:
    branches: [main]
  pull_request:   # never pull_request_target

# no permission by default; each job asks for exactly what it needs
permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.1   # >= 0.72.0 (GHSA-mcj4-mphf-j9ff, GHSA-q3fv-x8vg-qqm4, GHSA-8rc5-4fr6-64pw); never "latest"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # the whole history is scanned
          persist-credentials: false

      - name: Scan the whole history for secrets
        # official image v8.30.1, pinned by digest (immutable); exit code 1 if a secret is found
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose --no-banner

  iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning (Security tab)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 1. report: every severity, never fails, uploaded to the Security tab
      - name: trivy config report (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}   # the action's default (v0.70.0) is vulnerable
          scan-type: config
          scan-ref: platform
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # the gate below skips setup and runs this same binary from PATH: proves it is TRIVY_VERSION
      - name: Trivy version used by the gate
        run: trivy --version

      # 2. gate: HIGH and CRITICAL fail the job (to fix, or to justify in .trivyignore); LOW/MEDIUM are only reported
      - name: trivy config gate (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: platform
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
